<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letter-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0D9FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg-gradient)" />
  <!-- Stylized "A" letter -->
  <text
    x="32"
    y="46"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="38"
    font-weight="700"
    text-anchor="middle"
    fill="url(#letter-gradient)"
    letter-spacing="-1"
  >A</text>
  <!-- Accent bar under the crossbar of A -->
  <rect x="22" y="37" width="20" height="2.5" rx="1.25" fill="white" opacity="0.35" />
</svg>
